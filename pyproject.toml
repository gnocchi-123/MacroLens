[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "macrolens"
version = "0.1.0"
description = "미국 거시경제 기반 섹터 분석 — 미검증 연구용"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.scripts]
macrolens = "macrolens.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
